[project]
name = "rag-it"
version = "0.1.0"
description = "Local hybrid RAG over MinerU parsed PDF output."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "jieba>=0.42.1",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.12.1",
    "rapidocr-onnxruntime>=1.4.4",
    "requests>=2.32.3",
    "streamlit>=1.41.0",
    "typer>=0.15.1",
]

[project.scripts]
rag = "backend.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "front"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
